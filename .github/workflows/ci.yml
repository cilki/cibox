name: CI
on:
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
    - master
permissions:
  contents: read
jobs:
  rust-test:
    runs-on: ubuntu-latest
    container: rust:latest
    env:
      CARGO_HOME: .cargo
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Cache
      uses: actions/cache@v4
      with:
        key: rust-cache
        path: |-
          target/
          .cargo/
    - name: Run tests
      run: cargo test --all-features
    timeout-minutes: 30
