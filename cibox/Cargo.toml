[package]
name = "cibox"
version = "0.0.1"
edition = "2021"
authors = ["cilki"]
description = "Control your CI/CD"
license = "Unlicense"
repository = "https://github.com/fossable/cibox"
keywords = ["ci", "github-actions", "gitlab-ci", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
cilki = { version = "0.2", features = ["project-cibox", "terminal-graphics"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ron = "0.12"
strum = { version = "0.28", features = ["derive"] }
roniker = { version = "0.4", features = ["lsp"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1"
anyhow = "1.0"
cargo_toml = "1.0"
colored = "3.0.0"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
similar = "3.2"
yaml-edit = "0.3.2"

[build-dependencies]
roniker = { version = "0.4", features = ["analyze"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
